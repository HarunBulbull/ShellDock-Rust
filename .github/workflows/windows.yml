name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run setup:perl
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run test:rust
      - run: node scripts/run-cargo.cjs clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npx playwright install chromium
      - run: npx playwright test
      - run: npm run tauri build
      - name: Ensure WebView2 Runtime for native tests
        shell: pwsh
        run: ./scripts/setup-webview2.ps1
      - run: npm run test:desktop
      - name: Build isolated native file-test profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .tools | Out-Null
          $identifier = 'com.harunbulbul.shelldock.smoke.' + [Guid]::NewGuid().ToString('N')
          @{identifier=$identifier} | ConvertTo-Json | Set-Content -Encoding utf8 .tools/smoke-config.json
          npm run tauri build -- --no-bundle --config .tools/smoke-config.json
      - run: node scripts/smoke-files.cjs src-tauri/target/release/shelldock.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ShellDock-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
