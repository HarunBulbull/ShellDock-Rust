[package]
name = "shelldock"
version = "0.2.0"
description = "SSH and SFTP workspace for Windows"
authors = ["Harun Bulbul"]
edition = "2021"

[lib]
name = "shelldock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9.7", features = ["openssl-on-win32", "vendored-openssl"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
